<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Racing Arena: Sec A vs Sec B | Dream XR</title>
    
    <!-- Configs -->
    <script src="../secrets/firebase-config.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Odometer JS & CSS for MDM-Style Rolling Numbers -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/odometer.js/0.4.8/themes/odometer-theme-minimal.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/odometer.js/0.4.8/odometer.min.js"></script>

    <!-- Custom Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'marquee': 'marquee 25s linear infinite',
                        'uncover': 'uncover 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        marquee: { '0%': { transform: 'translateX(100%)' }, '100%': { transform: 'translateX(-100%)' } },
                        uncover: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
                    }
                }
            }
        }
    </script>

    <style>
        .bg-pattern { background-image: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.05) 1px, transparent 0); background-size: 30px 30px; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }
        
        .odometer.odometer-theme-minimal { font-family: 'Courier New', Courier, monospace; letter-spacing: -0.5px; font-weight: 800; }
        
        /* THE SECRET SAUCE FOR RACING BARS */
        .racing-row {
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
            position: absolute;
            left: 0;
            right: 0;
            height: 60px; /* Fixed height for calculations */
            z-index: 1; /* Default z-index */
        }

        /* Overtaking rows get brought to front via JS */
        .racing-row.overtaking {
            z-index: 50; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .racing-fill {
            transition: width 0.8s linear, background-color 0.3s;
            will-change: width;
            z-index: -1; /* Keep behind content */
        }

        .marquee-container {
            -webkit-mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
            mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
        }
    </style>
</head>
<body class="bg-[#050510] text-white font-sans overflow-hidden selection:bg-cyan-500/30 flex h-screen relative" id="app-body">

    <!-- Ambient Background Effects -->
    <div class="fixed inset-0 z-0 opacity-40 pointer-events-none bg-pattern"></div>
    <div class="fixed top-[-10%] left-[-10%] w-[50vw] h-[50vw] bg-cyan-600/10 rounded-full blur-[150px] z-0 pointer-events-none"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[50vw] h-[50vw] bg-purple-600/10 rounded-full blur-[150px] z-0 pointer-events-none"></div>

    <!-- DYNAMIC SIDEBAR CONTAINER -->
    <div id="sidebar-container" class="z-20 shrink-0 h-full"></div>

    <!-- MAIN CONTENT WRAPPER -->
    <div class="flex-1 flex flex-col relative z-10 overflow-hidden">
        
        <header class="h-20 bg-slate-950/80 backdrop-blur-xl border-b border-white/10 flex items-center justify-between px-6 shrink-0 z-20">
            <div class="flex items-center gap-4">
                <div class="px-3 py-1 bg-red-500/20 border border-red-500/40 rounded-md flex items-center gap-2 shadow-[0_0_15px_rgba(239,68,68,0.3)]">
                    <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                    <span class="text-xs font-black text-red-400 tracking-widest uppercase">Live Event</span>
                </div>
                <h1 class="text-xl font-black tracking-tight flex items-center gap-2">
                    <i data-lucide="swords" class="w-5 h-5 text-yellow-400"></i> CLASS WARS
                </h1>
            </div>

            <div class="flex items-center gap-6 ml-auto">
                <a href="../notifications.html" class="relative p-2 text-slate-400 hover:text-white transition-colors block">
                    <i data-lucide="bell" class="w-5 h-5"></i>
                    <span class="absolute top-1 right-1 w-2.5 h-2.5 bg-cyan-400 rounded-full shadow-[0_0_8px_#22d3ee]"></span>
                </a>
                <a href="../Profile/profile.html" class="w-9 h-9 rounded-full bg-slate-800 border-2 border-indigo-500 flex items-center justify-center overflow-hidden cursor-pointer shadow-[0_0_10px_rgba(99,102,241,0.4)] hover:scale-105 transition-transform">
                    <i data-lucide="user" class="w-4 h-4 text-indigo-300"></i>
                </a>
            </div>
        </header>

        <!-- MAIN LAYOUT -->
        <main class="flex-1 flex flex-col p-4 md:p-6 overflow-hidden relative min-h-0">
            
            <!-- TOP BATTLE BAR & CLASS TOTALS -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 w-full max-w-7xl mx-auto mb-6 opacity-0 animate-uncover shrink-0 items-center">
                
                <!-- Left: Tug-of-war Battle Bar -->
                <div class="lg:col-span-7 bg-slate-900/40 border border-white/5 rounded-3xl p-5 backdrop-blur-md">
                    <div class="flex justify-between text-xs font-black uppercase tracking-widest mb-2 px-1">
                        <span class="text-cyan-400">Section A (Blue)</span>
                        <span class="text-purple-400">Section B (Purple)</span>
                    </div>
                    <div class="w-full h-5 bg-slate-950 rounded-full overflow-hidden flex shadow-inner relative">
                        <div class="absolute left-1/2 top-0 bottom-0 w-1 bg-white/20 z-10 -translate-x-1/2"></div>
                        <div id="bar-sec-a" class="bg-gradient-to-r from-blue-600 to-cyan-400 h-full transition-all duration-700 ease-in-out" style="width: 50.6%;"></div>
                        <div id="bar-sec-b" class="bg-gradient-to-l from-pink-600 to-purple-500 h-full transition-all duration-700 ease-in-out" style="width: 49.4%;"></div>
                    </div>
                </div>
                
                <!-- Right: Section XP Counters with Odometers -->
                <div class="lg:col-span-5 flex gap-4 w-full h-full">
                    <div class="flex-1 bg-cyan-900/20 border border-cyan-500/20 rounded-3xl p-4 flex flex-col justify-center">
                        <span class="text-[10px] font-black uppercase text-cyan-400 tracking-wider mb-1">Sec A Total XP</span>
                        <h2 class="text-3xl font-black text-white leading-none"><span id="total-sec-a" class="odometer">1458200</span></h2>
                    </div>
                    <div class="flex-1 bg-purple-900/20 border border-purple-500/20 rounded-3xl p-4 flex flex-col justify-center">
                        <span class="text-[10px] font-black uppercase text-purple-400 tracking-wider mb-1">Sec B Total XP</span>
                        <h2 class="text-3xl font-black text-white leading-none"><span id="total-sec-b" class="odometer">1423100</span></h2>
                    </div>
                </div>

            </div>

            <!-- RACING BAR ARENA -->
            <div class="w-full max-w-7xl mx-auto flex-1 overflow-y-auto custom-scrollbar opacity-0 animate-uncover pr-2 relative" style="animation-delay: 0.2s;">
                <div class="flex items-center justify-between bg-slate-900/80 border-b border-white/10 px-4 py-3 mb-4 rounded-t-xl sticky top-0 z-30 backdrop-blur-md shadow-lg">
                    <div class="flex gap-4 w-full">
                        <span class="text-[10px] font-bold uppercase text-slate-500 w-12 text-center">Rank</span>
                        <span class="text-[10px] font-bold uppercase text-slate-500 flex-1">Student & Section</span>
                        <span class="text-[10px] font-bold uppercase text-slate-500 w-32 text-right">Live XP</span>
                    </div>
                </div>
                
                <!-- The Absolute Positioning Container for True Sliding Rows -->
                <!-- Height calculation: 20 students * (60px height + 8px gap) = ~1360px -->
                <div id="racing-arena" class="relative w-full h-[1400px]">
                    <!-- Loading Indicator -->
                    <div id="arena-loading" class="flex flex-col items-center justify-center pt-20 opacity-50">
                        <i data-lucide="loader-2" class="w-10 h-10 animate-spin text-cyan-400 mb-4"></i>
                        <p class="text-sm font-bold tracking-widest uppercase text-cyan-400">Initializing Grid Engine...</p>
                    </div>
                    <!-- Rows injected by JS -->
                </div>
            </div>

            <!-- Live ticker footer -->
            <div class="h-10 bg-[#0a051a] border-t border-white/10 shrink-0 flex items-center shadow-[0_-10px_20px_rgba(0,0,0,0.5)] z-20 relative mt-4 rounded-t-xl overflow-hidden">
                <div class="px-4 py-1 bg-red-600 text-white text-[10px] font-black uppercase tracking-widest h-full flex items-center shrink-0 border-r border-red-400 z-10">
                    FASTEST GROWING
                </div>
                <div class="flex-1 overflow-hidden marquee-container relative h-full flex items-center">
                    <div class="whitespace-nowrap animate-marquee flex items-center gap-10 text-xs font-bold text-slate-300" id="ticker-text">
                        <span>🚀 Rahul V. is on a 500 XP streak!</span>
                        <span>🔥 Section A is taking the lead!</span>
                        <span>⭐ Sarah M. just crossed 100k points!</span>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- MAIN JAVASCRIPT LOGIC -->
    <script>
        // Store functions globally to prevent ReferenceErrors
        let totalSecA = 1458200;
        let totalSecB = 1423100;
        let students = [];
        const ROW_HEIGHT = 60;
        const ROW_GAP = 8;
        let lastPositions = {}; // Store last Y pos to detect overtaking

        document.addEventListener("DOMContentLoaded", async () => {
            if (typeof lucide !== 'undefined') lucide.createIcons();
            await loadSidebar('classrooms');
            
            // Set global odometer format
            window.odometerOptions = { format: '(,ddd)', duration: 1000 };
            
            // Wait a tiny bit for DOM to settle, then initialize
            setTimeout(() => {
                initLiveArena();
            }, 500);
        });

        async function loadSidebar(activePage) {
            const sidebarContainer = document.getElementById('sidebar-container');
            try {
                const cacheBuster = new Date().getTime();
                const response = await fetch('../sidebar/sidebar.html?v=' + cacheBuster);
                if (!response.ok) throw new Error(`HTTP error!`);
                let html = await response.text();
                html = html.replace(/\[BASE\]/g, '../');
                sidebarContainer.innerHTML = html;
                
                const activeLink = document.querySelector(`.sidebar-link[data-page="${activePage}"]`);
                if (activeLink) activeLink.classList.add('bg-cyan-500/10', 'text-cyan-400', 'border-cyan-500/30');
                if (typeof lucide !== 'undefined') lucide.createIcons();
            } catch (error) { console.error("Sidebar load failed:", error); }
        }

        // --- RACING BAR ENGINE LOGIC ---
        function generateStudents() {
            const firstNames = ["Rahul", "Sarah", "Aman", "Priya", "Neha", "Vikram", "Tara", "Rohan", "Sneha", "Karan", "Aditi", "Mohit", "Pooja", "Arjun", "Ananya", "Ravi", "Simran", "Kabir", "Nisha", "Dev"];
            const lastNames = ["Verma", "Mirza", "Kumar", "Singh", "Sharma", "Rathore", "Desai", "Gupta", "Kapoor", "Joshi", "Bose", "Mehta", "Nair", "Reddy", "Das", "Menon", "Patel", "Sen", "Rao", "Iyer"];
            
            let currentBaseXP = 90000;
            
            for(let i=0; i<20; i++) {
                let section = i % 2 === 0 ? 'A' : 'B';
                let xp = currentBaseXP - (i * 2500) + Math.floor(Math.random() * 1000);
                let colorTheme = section === 'A' ? 'cyan' : 'purple';
                let barColorClass = section === 'A' ? 'bg-cyan-600' : 'bg-purple-600';
                let avatarImg = `https://ui-avatars.com/api/?name=${firstNames[i]}+${lastNames[i].charAt(0)}&background=${section==='A'?'06b6d4':'a855f7'}&color=fff&bold=true`;

                students.push({
                    id: `stu_${i}`,
                    name: `${firstNames[i]} ${lastNames[i].charAt(0)}.`,
                    xp: xp,
                    section: section,
                    theme: colorTheme,
                    barColor: barColorClass,
                    avatar: avatarImg
                });
            }
            // Initial Sort
            students.sort((a, b) => b.xp - a.xp);
        }

        function buildRacingDOM() {
            const arena = document.getElementById('racing-arena');
            const loading = document.getElementById('arena-loading');
            if(loading) loading.style.display = 'none';
            
            let maxXP = students[0].xp; // Top player defines 100% scale

            students.forEach((student, index) => {
                const rank = index + 1;
                // Calculate position physically using Y axis
                const yPos = index * (ROW_HEIGHT + ROW_GAP);
                lastPositions[student.id] = yPos;

                // Calculate bar width (Max width 85% to leave room for Odometer)
                const percent = (student.xp / maxXP) * 85; 

                // Rank Color Logic
                let rankStyle = 'text-slate-500 bg-slate-800';
                if(rank === 1) rankStyle = 'text-yellow-400 bg-yellow-500/20 border border-yellow-500/50 shadow-[0_0_10px_rgba(234,179,8,0.5)]';
                else if(rank === 2) rankStyle = 'text-slate-300 bg-slate-300/20 border border-slate-300/50 shadow-[0_0_10px_rgba(255,255,255,0.3)]';
                else if(rank === 3) rankStyle = 'text-orange-400 bg-orange-600/20 border border-orange-500/50 shadow-[0_0_10px_rgba(234,88,12,0.4)]';

                const rowHTML = `
                    <div id="row-${student.id}" class="racing-row rounded-xl overflow-hidden bg-black/40 border border-white/5 shadow-md flex items-center" style="transform: translateY(${yPos}px);">
                        
                        <!-- The Growing Progress Bar Background (Left aligned, behind content) -->
                        <div id="bar-${student.id}" class="racing-fill absolute top-0 left-0 bottom-0 ${student.barColor} shadow-[0_0_20px_currentColor] opacity-80 rounded-r-lg" style="width: ${percent}%;"></div>

                        <!-- Content on Top -->
                        <div class="relative z-10 flex items-center justify-between w-full h-full px-4">
                            <!-- Left: Rank, Avatar, Name -->
                            <div class="flex items-center gap-4">
                                <div id="rank-${student.id}" class="w-10 h-8 flex items-center justify-center rounded-lg font-black text-sm transition-colors duration-300 ${rankStyle}">
                                    ${rank}
                                </div>
                                <img src="${student.avatar}" class="w-8 h-8 rounded-full border-2 border-white/20 shadow-sm shrink-0">
                                <div class="flex flex-col">
                                    <span class="font-bold text-white text-base tracking-wide leading-tight drop-shadow-md">${student.name}</span>
                                    <span class="text-[9px] font-black uppercase text-${student.theme}-300 drop-shadow-md">Section ${student.section}</span>
                                </div>
                            </div>

                            <!-- Right: Fixed Odometer Score (Locks to right edge) -->
                            <div class="shrink-0 pl-4 border-l border-white/10 ml-auto h-full flex items-center bg-black/40 backdrop-blur-md px-6 rounded-r-xl">
                                <span id="xp-${student.id}" class="odometer text-2xl font-black text-cyan-400 drop-shadow-[0_0_8px_rgba(34,211,238,0.5)]">
                                    ${student.xp}
                                </span>
                            </div>
                        </div>
                    </div>
                `;
                arena.insertAdjacentHTML('beforeend', rowHTML);
            });
        }

        function initLiveArena() {
            generateStudents();
            buildRacingDOM();

            // The Racing Pulse: Every 1.2 seconds, inject chaos!
            setInterval(() => {
                // Give random XP bumps to 3-6 players
                const numBumps = Math.floor(Math.random() * 4) + 3; 

                for(let i=0; i<numBumps; i++) {
                    const idx = Math.floor(Math.random() * students.length);
                    // Boost top players slightly more to keep the race active, but give underdogs a chance
                    const isTop5 = students[idx].xp > students[4].xp;
                    const bump = isTop5 ? Math.floor(Math.random() * 300) + 50 : Math.floor(Math.random() * 500) + 10;
                    
                    students[idx].xp += bump;

                    if(students[idx].section === 'A') totalSecA += bump;
                    else totalSecB += bump;

                    // Trigger individual Odometer
                    const xpEl = document.getElementById(`xp-${students[idx].id}`);
                    if(xpEl) {
                        xpEl.innerHTML = students[idx].xp;
                        // Flash effect on text
                        xpEl.style.color = '#fff';
                        setTimeout(() => { xpEl.style.color = ''; }, 300);
                    }
                }

                // Update Total Top Odometers
                document.getElementById('total-sec-a').innerHTML = totalSecA;
                document.getElementById('total-sec-b').innerHTML = totalSecB;

                // Update Top Battle Bar Widths
                const total = totalSecA + totalSecB;
                const pctA = (totalSecA / total) * 100;
                const pctB = (totalSecB / total) * 100;
                document.getElementById('bar-sec-a').style.width = `${pctA}%`;
                document.getElementById('bar-sec-b').style.width = `${pctB}%`;

                // CRITICAL RACING LOGIC: Re-sort and Apply Physical Movement
                students.sort((a, b) => b.xp - a.xp);
                let maxXP = students[0].xp; // New benchmark for 100% width
                
                students.forEach((student, index) => {
                    const rank = index + 1;
                    const row = document.getElementById(`row-${student.id}`);
                    const rankBadge = document.getElementById(`rank-${student.id}`);
                    const bar = document.getElementById(`bar-${student.id}`);
                    
                    if(row) {
                        // Physically slide row up/down via translateY!
                        const newYPos = index * (ROW_HEIGHT + ROW_GAP);
                        const oldYPos = lastPositions[student.id];

                        row.style.transform = `translateY(${newYPos}px)`;
                        
                        // If overtaking (moving UP physically, meaning Y is decreasing)
                        if(newYPos < oldYPos) {
                            row.classList.add('overtaking');
                            setTimeout(() => row.classList.remove('overtaking'), 800);
                        }
                        
                        lastPositions[student.id] = newYPos;
                    }

                    if(bar) {
                        // Re-scale width relative to new #1 player (Max 85% to leave room for Odometer)
                        const percent = (student.xp / maxXP) * 85;
                        bar.style.width = `${percent}%`;
                    }
                    
                    if(rankBadge) {
                        rankBadge.innerText = rank;
                        let rankStyle = 'text-slate-500 bg-slate-800 border border-transparent shadow-none';
                        if(rank === 1) rankStyle = 'text-yellow-400 bg-yellow-500/20 border border-yellow-500/50 shadow-[0_0_10px_rgba(234,179,8,0.5)]';
                        else if(rank === 2) rankStyle = 'text-slate-300 bg-slate-300/20 border border-slate-300/50 shadow-[0_0_10px_rgba(255,255,255,0.3)]';
                        else if(rank === 3) rankStyle = 'text-orange-400 bg-orange-600/20 border border-orange-500/50 shadow-[0_0_10px_rgba(234,88,12,0.4)]';
                        
                        rankBadge.className = `w-10 h-8 flex items-center justify-center rounded-lg font-black text-sm transition-colors duration-300 ${rankStyle}`;
                    }
                });

            }, 1200); // 1.2s ticks for slightly smoother overtakes
        }
    </script>
</body>
</html>
