<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Dream XR</title>
    
    <!-- Load Firebase Configuration -->
    <script src="secrets/firebase-config.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'media',
            theme: {
                extend: {
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-glow': 'pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'spin-slow': 'spin 8s linear infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { opacity: 1, transform: 'scale(1)' },
                            '50%': { opacity: .8, transform: 'scale(1.05)' },
                        },
                        slideUp: {
                            '0%': { opacity: 0, transform: 'translateY(40px)' },
                            '100%': { opacity: 1, transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        .bg-pattern { background-size: 30px 30px; }
        @media (prefers-color-scheme: light) {
            .bg-pattern { background-image: radial-gradient(circle at 2px 2px, rgba(0,0,0,0.05) 1px, transparent 0); }
            .form-scrollbar::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.15); }
            .form-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(6, 182, 212, 0.5); }
            .custom-checkbox { background-color: #f8fafc; border-color: #cbd5e1; }
        }
        @media (prefers-color-scheme: dark) {
            .bg-pattern { background-image: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.05) 1px, transparent 0); }
            .form-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); }
            .form-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(34, 211, 238, 0.5); }
            .custom-checkbox { background-color: #0f172a; border-color: #334155; }
        }
        .form-scrollbar::-webkit-scrollbar { width: 6px; }
        .form-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .form-scrollbar::-webkit-scrollbar-thumb { border-radius: 10px; }
        .form-transition { transition: opacity 0.3s ease, transform 0.3s ease; }
        .custom-checkbox {
            appearance: none; margin: 0; font: inherit; color: #06b6d4; width: 1.5em; height: 1.5em;
            border: 2px solid; border-radius: 0.25em; display: grid; place-content: center; cursor: pointer; transition: all 0.2s ease;
        }
        .custom-checkbox::before {
            content: ""; width: 0.85em; height: 0.85em; transform: scale(0); transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em #06b6d4; transform-origin: center; clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        .custom-checkbox:checked::before { transform: scale(1); }
        .custom-checkbox:checked { border-color: #06b6d4; }
        .custom-checkbox:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white font-sans overflow-hidden selection:bg-cyan-500/30 flex items-center justify-center min-h-screen relative transition-colors duration-500">

    <!-- Ambient Background Effects -->
    <div class="absolute inset-0 z-0 opacity-40 pointer-events-none bg-pattern"></div>
    <div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] bg-purple-400/30 dark:bg-purple-700/20 rounded-full blur-[150px] z-0 pointer-events-none animate-float" style="animation-delay: 0s;"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[50vw] h-[50vw] bg-cyan-400/30 dark:bg-cyan-700/20 rounded-full blur-[150px] z-0 pointer-events-none animate-float" style="animation-delay: -3s;"></div>

    <!-- Full Screen Split Container -->
    <div class="w-full max-w-5xl h-[90vh] md:h-[80vh] bg-white/70 dark:bg-slate-900/60 backdrop-blur-2xl border border-slate-200 dark:border-white/10 rounded-[2.5rem] shadow-[0_20px_60px_rgba(0,0,0,0.1)] dark:shadow-[0_20px_60px_rgba(0,0,0,0.5)] relative z-10 animate-slide-up opacity-0 mx-4 flex flex-col md:flex-row overflow-hidden transition-colors duration-500">
        
        <!-- LEFT PANEL: Branding -->
        <div class="hidden md:flex md:w-5/12 bg-gradient-to-br from-slate-100 to-slate-200 dark:from-slate-900 dark:to-black p-10 flex-col justify-between relative overflow-hidden border-r border-slate-300 dark:border-white/5 transition-colors duration-500">
            <div class="absolute top-[-20%] right-[-20%] w-[120%] h-[120%] bg-gradient-to-bl from-cyan-500/10 to-transparent rounded-full blur-3xl pointer-events-none"></div>
            <div class="relative z-10">
                <div class="inline-flex p-3 bg-gradient-to-br from-cyan-400 to-purple-500 rounded-2xl shadow-[0_0_25px_rgba(6,182,212,0.4)] mb-6 animate-pulse-glow">
                    <i data-lucide="hexagon" class="text-white w-8 h-8"></i>
                </div>
                <h1 class="text-5xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-400 mb-4">Dream XR</h1>
                <p class="text-slate-600 dark:text-slate-400 text-lg font-medium leading-relaxed">Step into the future of education. Experience fully immersive 3D simulations for Chemistry, Physics, and Biology.</p>
            </div>
            <div class="relative z-10 w-full flex justify-center py-10">
                <div class="relative w-48 h-48 flex items-center justify-center">
                    <div class="absolute inset-0 border border-cyan-500/30 rounded-full animate-ping opacity-20"></div>
                    <div class="absolute inset-4 border border-purple-500/40 rounded-full animate-spin-slow" style="animation-duration: 10s;"></div>
                    <div class="absolute inset-8 border border-blue-500/50 rounded-full animate-spin-slow" style="animation-duration: 6s; animation-direction: reverse;"></div>
                    <i data-lucide="atom" class="w-16 h-16 text-cyan-500 dark:text-cyan-400 animate-float"></i>
                </div>
            </div>
            <div class="relative z-10">
                <p class="text-slate-500 text-sm font-semibold">© 2026 Dream XR Virtual Academy</p>
            </div>
        </div>

        <!-- RIGHT PANEL: Authentication Form -->
        <div class="w-full md:w-7/12 p-8 sm:p-12 overflow-y-auto form-scrollbar flex flex-col relative bg-slate-50/50 dark:bg-slate-900/30 transition-colors duration-500">
            
            <div class="flex md:hidden flex-col items-center mb-8">
                <div class="p-3 bg-gradient-to-br from-cyan-400 to-purple-500 rounded-2xl shadow-[0_0_25px_rgba(6,182,212,0.4)] mb-3 animate-pulse-glow">
                    <i data-lucide="hexagon" class="text-white w-8 h-8"></i>
                </div>
                <h1 class="text-3xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-400">Dream XR</h1>
            </div>

            <div class="mb-6">
                <h2 id="auth-title" class="text-2xl font-bold text-slate-900 dark:text-white mb-2">Welcome Back</h2>
                <p id="auth-subtitle" class="text-slate-500 dark:text-slate-400 text-sm font-medium">Please select your role and sign in to continue.</p>
            </div>

            <div id="error-msg" class="hidden mb-5 p-3.5 bg-red-500/10 border border-red-500/30 rounded-xl text-red-500 dark:text-red-400 text-sm font-medium flex items-start gap-3 transition-all">
                <i data-lucide="alert-circle" class="w-5 h-5 shrink-0 mt-0.5"></i>
                <span id="error-text">An error occurred.</span>
            </div>

            <div id="form-container" class="form-transition opacity-100 transform translate-y-0 flex-1 flex flex-col">
                
                <!-- Role Selection Toggle -->
                <div class="flex bg-slate-200/50 dark:bg-black/40 p-1.5 rounded-xl mb-6 border border-slate-300 dark:border-white/10 relative transition-colors duration-500">
                    <button type="button" id="role-student" onclick="setRole('student')" class="flex-1 py-2.5 rounded-lg bg-cyan-100 dark:bg-cyan-500/20 border border-cyan-300 dark:border-cyan-500/30 text-cyan-600 dark:text-cyan-400 font-bold transition-all shadow-sm flex items-center justify-center gap-2">
                        <i data-lucide="graduation-cap" class="w-4 h-4"></i> Student
                    </button>
                    <button type="button" id="role-educator" onclick="setRole('educator')" class="flex-1 py-2.5 rounded-lg text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-white transition-all flex items-center justify-center gap-2 border border-transparent">
                        <i data-lucide="presentation" class="w-4 h-4"></i> Educator
                    </button>
                </div>

                <form id="auth-form" class="flex flex-col gap-4">
                    
                    <!-- Full Name (Hidden by default, shown on Sign Up) -->
                    <div id="name-container" class="relative hidden transition-all duration-300">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="user" class="w-5 h-5"></i>
                        </div>
                        <input type="text" id="fullname" placeholder="Full Name" class="w-full bg-white dark:bg-black/40 border border-slate-300 dark:border-white/10 focus:border-cyan-500 dark:focus:border-cyan-400 focus:ring-1 focus:ring-cyan-500 dark:focus:ring-cyan-400 rounded-xl pl-12 pr-4 py-3.5 text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-500 transition-all outline-none font-medium shadow-sm dark:shadow-inner">
                    </div>

                    <!-- Email -->
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="mail" class="w-5 h-5"></i>
                        </div>
                        <input type="email" id="email" required placeholder="Email Address" class="w-full bg-white dark:bg-black/40 border border-slate-300 dark:border-white/10 focus:border-cyan-500 dark:focus:border-cyan-400 focus:ring-1 focus:ring-cyan-500 dark:focus:ring-cyan-400 rounded-xl pl-12 pr-4 py-3.5 text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-500 transition-all outline-none font-medium shadow-sm dark:shadow-inner">
                    </div>

                    <!-- Password -->
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="lock" class="w-5 h-5"></i>
                        </div>
                        <input type="password" id="password" required placeholder="Password" class="w-full bg-white dark:bg-black/40 border border-slate-300 dark:border-white/10 focus:border-cyan-500 dark:focus:border-cyan-400 focus:ring-1 focus:ring-cyan-500 dark:focus:ring-cyan-400 rounded-xl pl-12 pr-4 py-3.5 text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-500 transition-all outline-none font-medium shadow-sm dark:shadow-inner">
                    </div>

                    <!-- Mock reCAPTCHA Widget -->
                    <div class="bg-slate-50 dark:bg-[#1e293b] border border-slate-300 dark:border-slate-700 rounded-lg p-3 flex items-center justify-between mt-2 mb-2 shadow-sm transition-colors duration-500">
                        <div class="flex items-center gap-3">
                            <input type="checkbox" id="recaptcha-check" class="custom-checkbox">
                            <label for="recaptcha-check" class="text-sm text-slate-700 dark:text-slate-200 font-medium cursor-pointer">I'm not a robot</label>
                        </div>
                        <div class="flex flex-col items-center justify-center pr-2">
                            <svg class="w-8 h-8 opacity-80" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 20C7.59 20 4 16.41 4 12C4 7.59 7.59 4 12 4C16.41 4 20 7.59 20 12C20 16.41 16.41 20 12 20ZM15 9C15 10.66 13.66 12 12 12C10.34 12 9 10.66 9 9C9 7.34 10.34 6 12 6C13.66 6 15 7.34 15 9ZM12 14C9.33 14 4 15.34 4 18V19H20V18C20 15.34 14.67 14 12 14Z" fill="#3b82f6"/>
                            </svg>
                            <span class="text-[9px] text-slate-500 dark:text-slate-400 mt-0.5 tracking-wide">reCAPTCHA</span>
                        </div>
                    </div>

                    <!-- Dynamic Action Buttons -->
                    <div class="flex flex-col gap-3 mt-2">
                        <button type="submit" id="primary-action-btn" disabled class="w-full py-4 bg-gradient-to-r from-cyan-500 to-blue-600 text-white rounded-xl font-bold shadow-[0_0_20px_rgba(6,182,212,0.3)] transition-all flex items-center justify-center gap-2 opacity-50 cursor-not-allowed">
                            <i data-lucide="log-in" class="w-5 h-5"></i> Sign In
                        </button>
                        
                        <button type="button" id="toggle-mode-btn" class="w-full py-3 bg-slate-200 hover:bg-slate-300 dark:bg-white/5 dark:hover:bg-white/10 border border-slate-300 dark:border-white/10 text-slate-700 hover:text-slate-900 dark:text-slate-300 dark:hover:text-white rounded-xl font-bold transition-all flex items-center justify-center gap-2">
                            <i data-lucide="user-plus" class="w-5 h-5"></i> Create an Account
                        </button>
                    </div>
                </form>

                <div class="mt-8 mb-6 flex items-center gap-4">
                    <div class="flex-1 h-px bg-slate-300 dark:bg-white/10"></div>
                    <span class="text-slate-500 text-xs font-bold uppercase tracking-wider">Or continue with</span>
                    <div class="flex-1 h-px bg-slate-300 dark:bg-white/10"></div>
                </div>

                <!-- Social Providers Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
                    <!-- Google Sign-in -->
                    <button type="button" id="google-btn" class="sm:col-span-2 py-3 bg-white text-slate-900 hover:bg-slate-50 dark:hover:bg-slate-200 border border-slate-300 dark:border-transparent rounded-xl font-bold transition-transform hover:-translate-y-1 active:scale-95 flex items-center justify-center gap-3 shadow-sm dark:shadow-md">
                        <svg class="w-5 h-5" viewBox="0 0 24 24">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                        </svg>
                        Google
                    </button>

                    <!-- GitHub Sign-in -->
                    <button type="button" id="github-btn" class="py-3 bg-[#24292e] text-white hover:bg-[#2f363d] rounded-xl font-bold transition-transform hover:-translate-y-1 active:scale-95 flex items-center justify-center gap-2 border border-transparent dark:border-white/10 shadow-md">
                        <i data-lucide="github" class="w-5 h-5"></i> GitHub
                    </button>

                    <!-- Game Center Sign-in -->
                    <button type="button" id="gamecenter-btn" class="py-3 bg-gradient-to-r from-pink-500 via-red-500 to-yellow-500 text-white hover:opacity-90 rounded-xl font-bold transition-transform hover:-translate-y-1 active:scale-95 flex items-center justify-center gap-2 border border-transparent dark:border-white/10 shadow-md">
                        <i data-lucide="gamepad-2" class="w-5 h-5"></i> Game Center
                    </button>
                </div>

                <!-- Anonymous Sign-in -->
                <div class="mt-auto pt-4 text-center">
                    <button type="button" id="anonymous-btn" class="text-slate-500 hover:text-cyan-600 dark:text-slate-400 dark:hover:text-cyan-400 text-sm font-bold transition-colors flex items-center justify-center gap-2 mx-auto pb-2">
                        <i data-lucide="user-circle" class="w-4 h-4"></i> Continue as Guest
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- Initialization & Scripts -->
    <script type="module">
        lucide.createIcons();

        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            updateProfile,
            onAuthStateChanged,
            GoogleAuthProvider, 
            GithubAuthProvider,
            OAuthProvider,
            signInAnonymously,
            signInWithPopup 
        } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        if (typeof firebaseConfig === 'undefined' || firebaseConfig.apiKey === "YOUR_API_KEY") {
            document.getElementById('error-text').innerText = "Firebase config missing. Update secrets/firebase-config.js";
            document.getElementById('error-msg').classList.remove('hidden');
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        // --- AUTH STATE LISTENER (Redirect if already logged in) ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User is already signed in, skip login!
                window.location.href = "index.html";
            }
        });
        
        const googleProvider = new GoogleAuthProvider();
        const githubProvider = new GithubAuthProvider();
        const gameCenterProvider = new OAuthProvider('gc.apple.com');

        const authForm = document.getElementById('auth-form');
        const formContainer = document.getElementById('form-container');
        const authTitle = document.getElementById('auth-title');
        const authSubtitle = document.getElementById('auth-subtitle');
        const nameContainer = document.getElementById('name-container');
        const fullnameInput = document.getElementById('fullname');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        
        const primaryActionBtn = document.getElementById('primary-action-btn');
        const toggleModeBtn = document.getElementById('toggle-mode-btn');
        const googleBtn = document.getElementById('google-btn');
        const githubBtn = document.getElementById('github-btn');
        const gamecenterBtn = document.getElementById('gamecenter-btn');
        const anonymousBtn = document.getElementById('anonymous-btn');
        
        const errorMsgBox = document.getElementById('error-msg');
        const errorText = document.getElementById('error-text');
        const recaptchaCheck = document.getElementById('recaptcha-check');

        let isSignUpMode = false;
        window.currentRole = 'student'; 

        window.setRole = function(role) {
            window.currentRole = role;
            const studentBtn = document.getElementById('role-student');
            const educatorBtn = document.getElementById('role-educator');
            
            if(role === 'student') {
                studentBtn.className = 'flex-1 py-2.5 rounded-lg bg-cyan-100 dark:bg-cyan-500/20 border border-cyan-300 dark:border-cyan-500/30 text-cyan-600 dark:text-cyan-400 font-bold transition-all shadow-sm flex items-center justify-center gap-2';
                educatorBtn.className = 'flex-1 py-2.5 rounded-lg text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-white transition-all flex items-center justify-center gap-2 border border-transparent';
            } else {
                educatorBtn.className = 'flex-1 py-2.5 rounded-lg bg-purple-100 dark:bg-purple-500/20 border border-purple-300 dark:border-purple-500/30 text-purple-600 dark:text-purple-400 font-bold transition-all shadow-sm flex items-center justify-center gap-2';
                studentBtn.className = 'flex-1 py-2.5 rounded-lg text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-white transition-all flex items-center justify-center gap-2 border border-transparent';
            }
        }

        function updateSubmitButtonState() {
            if (recaptchaCheck.checked) {
                primaryActionBtn.disabled = false;
                primaryActionBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                primaryActionBtn.classList.add('hover:-translate-y-1', 'active:scale-95');
            } else {
                primaryActionBtn.disabled = true;
                primaryActionBtn.classList.add('opacity-50', 'cursor-not-allowed');
                primaryActionBtn.classList.remove('hover:-translate-y-1', 'active:scale-95');
            }
        }

        recaptchaCheck.addEventListener('change', (e) => {
            if(e.target.checked) {
                e.target.disabled = true;
                setTimeout(() => {
                    e.target.disabled = false;
                    updateSubmitButtonState();
                }, 600);
            } else {
                updateSubmitButtonState();
            }
        });

        // Toggle Form Mode (Sign In <-> Sign Up) with Name Field animation
        toggleModeBtn.addEventListener('click', () => {
            isSignUpMode = !isSignUpMode;
            hideError();
            
            formContainer.style.opacity = '0';
            formContainer.style.transform = 'translateY(10px)';
            
            setTimeout(() => {
                if (isSignUpMode) {
                    authTitle.innerText = "Create Account";
                    authSubtitle.innerText = "Join Dream XR as a Student or Educator.";
                    primaryActionBtn.innerHTML = '<i data-lucide="user-plus" class="w-5 h-5"></i> Sign Up';
                    toggleModeBtn.innerHTML = '<i data-lucide="arrow-left" class="w-5 h-5"></i> Back to Login';
                    nameContainer.classList.remove('hidden'); // Show Name Field
                } else {
                    authTitle.innerText = "Welcome Back";
                    authSubtitle.innerText = "Please select your role and sign in to continue.";
                    primaryActionBtn.innerHTML = '<i data-lucide="log-in" class="w-5 h-5"></i> Sign In';
                    toggleModeBtn.innerHTML = '<i data-lucide="user-plus" class="w-5 h-5"></i> Create an Account';
                    nameContainer.classList.add('hidden'); // Hide Name Field
                }
                
                recaptchaCheck.checked = false;
                updateSubmitButtonState();
                lucide.createIcons();
                
                formContainer.style.opacity = '1';
                formContainer.style.transform = 'translateY(0)';
            }, 300); 
        });

        function showError(message) {
            errorText.innerText = message;
            errorMsgBox.classList.remove('hidden');
            errorMsgBox.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-5px)' }, { transform: 'translateX(5px)' }, { transform: 'translateX(0)' }], { duration: 300 });
        }
        function hideError() { errorMsgBox.classList.add('hidden'); }

        // 1. Handle Form Submit (Sign Up & Sign In)
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            
            if (!recaptchaCheck.checked) {
                showError("Please complete the reCAPTCHA verification.");
                return;
            }
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const fullname = fullnameInput.value.trim();

            if (isSignUpMode) {
                if (!email || !password || !fullname) {
                    showError("Please fill out all fields.");
                    return;
                }
                try {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    // Save the user's name to their Firebase Profile
                    await updateProfile(userCredential.user, { displayName: fullname });
                    localStorage.setItem('userRole', window.currentRole);
                    // onAuthStateChanged will handle the redirect automatically
                } catch (error) {
                    let readableError = error.message;
                    if (error.code === 'auth/email-already-in-use') readableError = "An account already exists with this email.";
                    if (error.code === 'auth/weak-password') readableError = "Password should be at least 6 characters.";
                    showError(readableError);
                }
            } else {
                try {
                    await signInWithEmailAndPassword(auth, email, password);
                    localStorage.setItem('userRole', window.currentRole);
                    // onAuthStateChanged will handle the redirect automatically
                } catch (error) {
                    let readableError = "Invalid email or password.";
                    if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') readableError = "No account found with this email/password combination.";
                    if (error.code === 'auth/too-many-requests') readableError = "Too many failed attempts. Try again later.";
                    showError(readableError);
                }
            }
        });

        // 3. Handle Google Sign-In
        googleBtn.addEventListener('click', async () => {
            hideError();
            try {
                await signInWithPopup(auth, googleProvider);
                localStorage.setItem('userRole', window.currentRole);
            } catch (error) {
                showError("Google Sign-In failed. Please try again.");
            }
        });

        // 4. Handle GitHub Sign-In
        githubBtn.addEventListener('click', async () => {
            hideError();
            try {
                await signInWithPopup(auth, githubProvider);
                localStorage.setItem('userRole', window.currentRole);
            } catch (error) {
                let msg = "GitHub Sign-In failed.";
                if (error.code === 'auth/account-exists-with-different-credential') msg = "An account already exists with the same email but different sign-in credentials.";
                showError(msg);
            }
        });

        // 5. Handle Game Center Sign-In
        gamecenterBtn.addEventListener('click', async () => {
            hideError();
            try {
                await signInWithPopup(auth, gameCenterProvider);
                localStorage.setItem('userRole', window.currentRole);
            } catch (error) {
                showError("Game Center Sign-In failed or is not configured.");
            }
        });

        // 6. Handle Anonymous Sign-In (Guest)
        anonymousBtn.addEventListener('click', async () => {
            hideError();
            try {
                await signInAnonymously(auth);
                localStorage.setItem('userRole', window.currentRole);
            } catch (error) {
                showError("Guest Sign-In failed. Please check your connection.");
            }
        });
    </script>
</body>
</html>
