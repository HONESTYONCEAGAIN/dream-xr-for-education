<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | Dream XR</title>
    
    <!-- Load Configuration Files -->
    <script src="secrets/firebase-config.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'spin-slow': 'spin 4s linear infinite',
                        'float': 'float 3s ease-in-out infinite',
                        'typing': 'typing 1.2s steps(20, end) forwards',
                        'blink': 'blink 1s step-end infinite',
                        'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'fade-in': 'fadeIn 0.5s ease-out forwards'
                    },
                    keyframes: {
                        typing: { '0%': { width: '0' }, '100%': { width: '160px' } },
                        blink: { '0%, 100%': { borderColor: 'transparent' }, '50%': { borderColor: '#22d3ee' } },
                        float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-8px)' } },
                        slideUp: { '0%': { opacity: 0, transform: 'translateY(40px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },
                        fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } }
                    }
                }
            }
        }
    </script>

    <style>
        html, body { background-color: #020617; color: #ffffff; }
        .bg-pattern { background-image: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.07) 1px, transparent 0); background-size: 30px 30px; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(34, 211, 238, 0.5); /* Cyan hover for notifications */ }
    </style>
</head>
<body class="bg-slate-950 text-white font-sans overflow-hidden selection:bg-cyan-500/30 flex h-screen hidden relative" id="app-body">

    <!-- Ambient Background Effects -->
    <div class="fixed inset-0 z-0 opacity-30 pointer-events-none bg-pattern"></div>
    <!-- Cyan and Purple ambient glows for the Cyberpunk theme -->
    <div class="fixed top-[-10%] left-[-5%] w-[40vw] h-[40vw] bg-cyan-700/15 rounded-full blur-[120px] z-0 pointer-events-none"></div>
    <div class="fixed bottom-[-10%] right-[-5%] w-[40vw] h-[40vw] bg-purple-700/15 rounded-full blur-[120px] z-0 pointer-events-none"></div>

    <!-- SIDEBAR -->
    <aside class="w-72 bg-slate-900/40 backdrop-blur-xl border-r border-white/10 flex flex-col relative z-20 shrink-0 shadow-[5px_0_30px_rgba(0,0,0,0.3)]">
        
        <div class="h-24 flex items-center px-6 border-b border-white/10 gap-4 shrink-0">
            <div class="p-2.5 bg-gradient-to-br from-cyan-400 to-purple-500 rounded-xl shadow-[0_0_15px_rgba(6,182,212,0.4)] hover:scale-105 transition-transform">
                <i data-lucide="hexagon" class="text-white w-7 h-7 animate-pulse"></i>
            </div>
            <div class="inline-block overflow-hidden whitespace-nowrap border-r-2 border-cyan-400 animate-typing" style="animation: typing 1s steps(20, end) forwards, blink 1s step-end infinite;">
                <h1 class="text-3xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-400 pb-1">
                    Dream XR
                </h1>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto py-8 px-4 flex flex-col gap-3">
            <p class="px-4 text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Main Menu</p>
            
            <a href="index.html" class="flex items-center gap-3 px-4 py-3.5 rounded-2xl text-slate-400 hover:bg-white/5 hover:text-white transition-all group">
                <i data-lucide="layout-dashboard" class="w-5 h-5 group-hover:text-cyan-400 transition-colors"></i>
                <span class="font-semibold text-sm">Dashboard</span>
            </a>
            <a href="chemistry.html" class="flex items-center gap-3 px-4 py-3.5 rounded-2xl text-slate-400 hover:bg-white/5 hover:text-white transition-all group">
                <i data-lucide="flask-conical" class="w-5 h-5 group-hover:text-cyan-400 transition-colors animate-float"></i>
                <span class="font-semibold text-sm">Chemistry Lab</span>
            </a>
            <a href="physics.html" class="flex items-center gap-3 px-4 py-3.5 rounded-2xl text-slate-400 hover:bg-white/5 hover:text-white transition-all group">
                <i data-lucide="atom" class="w-5 h-5 group-hover:text-orange-400 transition-colors animate-spin-slow"></i>
                <span class="font-semibold text-sm">Physics Engine</span>
            </a>
            <a href="bio.html" class="flex items-center gap-3 px-4 py-3.5 rounded-2xl text-slate-400 hover:bg-white/5 hover:text-white transition-all group">
                <i data-lucide="dna" class="w-5 h-5 group-hover:text-purple-400 transition-colors"></i>
                <span class="font-semibold text-sm">Biology 3D</span>
            </a>

            <p class="px-4 text-xs font-bold text-slate-500 uppercase tracking-wider mt-6 mb-2">Tools & AI</p>
            
            <a href="aitutor.html" class="flex items-center justify-between px-4 py-3.5 rounded-2xl text-slate-400 hover:bg-white/5 hover:text-white transition-all group">
                <div class="flex items-center gap-3">
                    <i data-lucide="bot" class="w-5 h-5 group-hover:text-green-400 transition-colors"></i>
                    <span class="font-semibold text-sm">AI Tutor</span>
                </div>
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
            </a>
            
            <a href="labhistory.html" class="flex items-center gap-3 px-4 py-3.5 rounded-2xl text-slate-400 hover:bg-white/5 hover:text-white transition-all group">
                <i data-lucide="history" class="w-5 h-5 group-hover:text-blue-400 transition-colors"></i>
                <span class="font-semibold text-sm">Lab History</span>
            </a>

            <p class="px-4 text-xs font-bold text-slate-500 uppercase tracking-wider mt-6 mb-2">Account</p>
            <a href="plans.html" class="flex items-center gap-3 px-4 py-3.5 rounded-2xl text-slate-400 hover:bg-white/5 hover:text-white transition-all group">
                <i data-lucide="credit-card" class="w-5 h-5 group-hover:text-yellow-400 transition-colors"></i>
                <span class="font-semibold text-sm">Plans & Upgrade</span>
            </a>
            <a href="profile.html" class="flex items-center gap-3 px-4 py-3.5 rounded-2xl text-slate-400 hover:bg-white/5 hover:text-white transition-all group">
                <i data-lucide="user" class="w-5 h-5 group-hover:text-cyan-400 transition-colors"></i>
                <span class="font-semibold text-sm">My Profile</span>
            </a>
        </div>

        <div class="p-6 border-t border-white/10 bg-black/20 shrink-0">
            <a href="settings.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-white/5 hover:text-white transition-all group">
                <i data-lucide="settings" class="w-5 h-5 group-hover:rotate-90 transition-transform duration-500"></i>
                <span class="font-semibold text-sm">Settings</span>
            </a>
        </div>
    </aside>

    <!-- MAIN CONTENT WRAPPER -->
    <div class="flex-1 flex flex-col relative z-10 overflow-hidden">
        
        <!-- TOP BAR -->
        <header class="h-24 bg-slate-950/40 backdrop-blur-lg border-b border-white/10 flex items-center justify-between px-10 shrink-0 z-20">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-cyan-500/20 rounded-2xl flex items-center justify-center border border-cyan-500/30 shadow-[0_0_15px_rgba(6,182,212,0.2)]">
                    <i data-lucide="bell" class="w-6 h-6 text-cyan-400"></i>
                </div>
                <div>
                    <h2 class="text-xl font-bold text-white tracking-wide">Notification Center</h2>
                    <p class="text-xs text-slate-400 font-medium">Manage your alerts and system updates</p>
                </div>
            </div>

            <!-- Right side: Profile -->
            <div class="flex items-center gap-6 ml-auto">
                <a href="profile.html" class="w-11 h-11 rounded-full bg-slate-800 border-2 border-purple-500 flex items-center justify-center overflow-hidden shadow-[0_0_10px_rgba(168,85,247,0.4)] hover:scale-105 transition-transform ml-2 cursor-pointer">
                    <i data-lucide="user" class="w-5 h-5 text-purple-300"></i>
                </a>
            </div>
        </header>

        <!-- NOTIFICATIONS CONTENT -->
        <main class="flex-1 overflow-y-auto p-6 md:p-10 custom-scrollbar relative">
            
            <div class="max-w-4xl mx-auto flex flex-col gap-6 animate-slide-up opacity-0" style="animation-fill-mode: forwards;">
                
                <!-- HEADER & ACTIONS BAR -->
                <div class="flex flex-col md:flex-row items-center justify-between gap-4 bg-slate-900/40 p-2 rounded-2xl border border-white/5">
                    <!-- Filters -->
                    <div class="flex items-center gap-2 w-full md:w-auto overflow-x-auto custom-scrollbar pb-1 md:pb-0 px-2 md:px-0">
                        <button onclick="filterNotifications('all', this)" class="filter-btn active-filter px-5 py-2.5 rounded-xl bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 font-bold text-sm whitespace-nowrap transition-colors">All Alerts</button>
                        <button onclick="filterNotifications('unread', this)" class="filter-btn px-5 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-white/10 border border-transparent font-medium text-sm whitespace-nowrap transition-colors flex items-center gap-2">
                            Unread <span id="unread-badge" class="bg-cyan-500 text-slate-950 text-[10px] px-2 py-0.5 rounded-full font-bold">2</span>
                        </button>
                        <button onclick="filterNotifications('system', this)" class="filter-btn px-5 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-white/10 border border-transparent font-medium text-sm whitespace-nowrap transition-colors">System</button>
                    </div>
                    
                    <!-- Global Actions -->
                    <div class="flex items-center gap-3 w-full md:w-auto px-2">
                        <button onclick="markAllAsRead()" class="flex-1 md:flex-none px-4 py-2 bg-white/5 hover:bg-cyan-500/20 text-slate-300 hover:text-cyan-300 border border-transparent hover:border-cyan-500/30 rounded-xl text-sm font-semibold transition-colors flex items-center justify-center gap-2">
                            <i data-lucide="check-check" class="w-4 h-4"></i> Mark all read
                        </button>
                    </div>
                </div>

                <!-- NOTIFICATION LIST CONTAINER -->
                <div class="flex flex-col gap-3 pb-20" id="notifications-container">
                    <!-- Loading State -->
                    <div id="notifications-loading" class="py-16 flex flex-col items-center justify-center opacity-50 relative z-10">
                        <i data-lucide="loader-2" class="w-8 h-8 text-cyan-400 animate-spin mb-4"></i>
                        <p class="text-sm font-bold tracking-widest uppercase text-cyan-400">Syncing Alerts...</p>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- UI Scripts -->
    <script>
        lucide.createIcons();

        // --- DUMMY NOTIFICATIONS DATA ---
        let notificationsData = [
            {
                id: 1,
                type: 'system',
                icon: 'check-circle-2',
                color: 'green',
                title: 'Welcome to Dream XR!',
                message: 'Your immersive academy is ready. Head over to the Chemistry Lab to start your first virtual experiment.',
                time: 'Just now',
                unread: true,
                link: 'chemistry.html'
            },
            {
                id: 2,
                type: 'system',
                icon: 'sparkles',
                color: 'purple',
                title: 'Nova AI Engine Updated',
                message: 'Your AI tutor now supports advanced biological explanations and faster response times.',
                time: '2 hours ago',
                unread: true,
                link: 'aitutor.html'
            },
            {
                id: 3,
                type: 'system',
                icon: 'atom',
                color: 'orange',
                title: 'Physics Engine Teaser',
                message: 'Sneak peek! Get ready for real-time optics and kinematics coming in the next big update.',
                time: '1 day ago',
                unread: false,
                link: 'physics.html'
            },
            {
                id: 4,
                type: 'account',
                icon: 'credit-card',
                color: 'yellow',
                title: 'Global Launch Sale Active',
                message: 'Upgrade to Pro Scholar or Ultra Vision today and get an automatic 50% off your subscription.',
                time: '3 days ago',
                unread: false,
                link: 'plans.html'
            }
        ];

        let currentFilter = 'all';

        // --- RENDER LOGIC ---
        function renderNotifications() {
            const container = document.getElementById('notifications-container');
            const loading = document.getElementById('notifications-loading');
            
            if (loading) loading.style.display = 'none';
            container.innerHTML = '';

            let filteredData = notificationsData.filter(n => {
                if (currentFilter === 'unread') return n.unread;
                if (currentFilter === 'system') return n.type === 'system';
                return true; // 'all'
            });

            // Update Unread Badge Count
            const unreadCount = notificationsData.filter(n => n.unread).length;
            const badge = document.getElementById('unread-badge');
            if (badge) {
                badge.innerText = unreadCount;
                badge.style.display = unreadCount > 0 ? 'inline-block' : 'none';
            }

            if (filteredData.length === 0) {
                container.innerHTML = `
                    <div class="py-20 flex flex-col items-center justify-center opacity-50 text-center animate-fade-in">
                        <div class="w-20 h-20 bg-slate-800 rounded-full flex items-center justify-center mb-4 border border-slate-700">
                            <i data-lucide="bell-off" class="w-10 h-10 text-slate-500"></i>
                        </div>
                        <h3 class="text-xl font-bold text-slate-300 mb-2">You're all caught up!</h3>
                        <p class="text-slate-500 text-sm">There are no ${currentFilter !== 'all' ? currentFilter : ''} notifications to show.</p>
                    </div>
                `;
            } else {
                filteredData.forEach((notification, index) => {
                    const delay = index * 0.05;
                    const unreadDot = notification.unread 
                        ? `<div class="absolute top-4 right-4 w-3 h-3 bg-cyan-400 rounded-full shadow-[0_0_10px_rgba(34,211,238,0.8)] animate-pulse"></div>` 
                        : '';
                    const bgClass = notification.unread 
                        ? 'bg-slate-800/80 border-slate-600' 
                        : 'bg-slate-900/60 border-white/10';

                    const cardHTML = `
                        <div class="relative p-5 rounded-2xl ${bgClass} hover:bg-slate-800 transition-colors backdrop-blur-xl group animate-fade-in opacity-0 shadow-lg" style="animation-delay: ${delay}s; animation-fill-mode: forwards;">
                            ${unreadDot}
                            <div class="flex items-start gap-5">
                                <div class="w-12 h-12 rounded-xl bg-${notification.color}-500/20 text-${notification.color}-400 flex items-center justify-center shrink-0 border border-${notification.color}-500/30">
                                    <i data-lucide="${notification.icon}" class="w-6 h-6"></i>
                                </div>
                                <div class="flex-1 pr-8">
                                    <div class="flex items-center gap-3 mb-1">
                                        <h4 class="text-white font-bold text-lg">${notification.title}</h4>
                                        <span class="text-xs text-slate-500 font-semibold bg-black/30 px-2 py-0.5 rounded border border-white/5">
                                            ${notification.time}
                                        </span>
                                    </div>
                                    <p class="text-sm text-slate-400 leading-relaxed mb-3">${notification.message}</p>
                                    
                                    <div class="flex items-center gap-3 mt-2">
                                        ${notification.link ? `
                                        <a href="${notification.link}" class="text-xs font-bold text-cyan-400 hover:text-cyan-300 transition-colors flex items-center gap-1">
                                            View Details <i data-lucide="arrow-right" class="w-3 h-3"></i>
                                        </a>
                                        ` : ''}
                                        
                                        ${notification.unread ? `
                                        <button onclick="markAsRead(${notification.id})" class="text-xs font-bold text-slate-500 hover:text-white transition-colors flex items-center gap-1 opacity-0 group-hover:opacity-100">
                                            <i data-lucide="check" class="w-3 h-3"></i> Mark Read
                                        </button>
                                        ` : ''}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', cardHTML);
                });
            }
            lucide.createIcons();
        }

        // --- FILTERING ---
        window.filterNotifications = function(type, element) {
            currentFilter = type;
            
            // Update button styles
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active-filter', 'bg-cyan-500/20', 'text-cyan-400', 'border-cyan-500/30', 'font-bold');
                btn.classList.add('text-slate-400', 'border-transparent', 'font-medium');
            });
            element.classList.add('active-filter', 'bg-cyan-500/20', 'text-cyan-400', 'border-cyan-500/30', 'font-bold');
            element.classList.remove('text-slate-400', 'border-transparent', 'font-medium');

            renderNotifications();
        };

        // --- ACTIONS ---
        window.markAsRead = function(id) {
            const index = notificationsData.findIndex(n => n.id === id);
            if (index !== -1) {
                notificationsData[index].unread = false;
                renderNotifications();
            }
        };

        window.markAllAsRead = function() {
            let changed = false;
            notificationsData.forEach(n => {
                if(n.unread) {
                    n.unread = false;
                    changed = true;
                }
            });
            if (changed) {
                renderNotifications();
            }
        };

    </script>

    <!-- FIREBASE INIT & LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        if (typeof firebaseConfig !== 'undefined') {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);

            onAuthStateChanged(auth, (user) => {
                if (!user) {
                    window.location.href = "login.html";
                } else {
                    document.getElementById('app-body').classList.remove('hidden');
                    // Simulate fetching from cloud with a short timeout
                    setTimeout(() => {
                        renderNotifications();
                    }, 600);
                }
            });
        }
    </script>
</body>
</html>
